{% extends "base.html" %}

{% block title %}Registro | PetSafe{% endblock %}

{% block contenido %}
<section class="auth-layout">
    <article class="tarjeta-auth">
        <span class="etiqueta-pantalla">Registro</span>
        <h1>Crea tu cuenta</h1>
        <p class="subtitulo-auth">
            Regístrate para publicar reportes, contactar dueños y ayudar a encontrar mascotas.
        </p>

        <form method="POST" class="formulario-auth">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text" placeholder="Tu nombre" required>

            <label for="correo">Correo electrónico</label>
            <input id="correo" name="correo" type="email" placeholder="ejemplo@correo.com" required>

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" placeholder="Mínimo 6 caracteres" required>

            <button type="submit" class="boton-principal boton-ancho">Crear cuenta</button>
        </form>

        <p class="texto-centro texto-suave">
            ¿Ya tienes cuenta?
            <a href="{{ url_for('login') }}">Inicia sesión</a>
        </p>
    </article>
</section>
{% endblock %}
